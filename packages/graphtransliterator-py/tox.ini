[tox]
skipsdist = true
envlist = py310, py311, py312, py313

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
# 👇 Removed the 'packages/graphtransliterator-py' prefix because tox runs from here now
passenv = PYTHON_VERSION
allowlist_externals = poetry
commands =
    poetry install -v
    poetry run pytest --doctest-modules tests --cov --cov-config=pyproject.toml --cov-report=xml
