[project]
name = "graphtransliterator"
version = "1.4.1"
description = "A graph-based transliteration tool"
authors = [{ name = "A. Sean Pue", email = "seanpue@users.noreply.github.com" }]
license = "MIT"
readme = "README.rst"
requires-python = ">=3.11,<4.0"
dependencies = [
    "click (>=8.1.7,<9.0.0)",
    "marshmallow (>=3.20.1,<4.0.0)",
    "PyYAML (>=6.0.1,<7.0.0)",
    "typing-extensions (>=4.16.0,<5.0.0)",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
repository = "https://github.com/seanpue/graphtransliterator"
documentation = "https://graphtransliterator.readthedocs.org"

[project.scripts]
graphtransliterator = "graphtransliterator.cli:main"

[tool.poetry]
packages = [{ include = "graphtransliterator", from = "src" }]
include = ["src/graphtransliterator/py.typed"]

[tool.poetry.group.dev.dependencies]
bash_kernel = "^0.10.0"
coverage = "^7.15.2"
flake8 = "^7.3.0"
jupyter-sphinx = "^0.5.3"
pytest = "^9.1.1"
sphinx-issues = "^6.0.0"
tox = "^4.58.0"
deptry = "^0.25.1"
pre-commit = "^4.6.1"
sphinx-rtd-theme = "^3.1.0"
pytest-cov = "^7.1.0"
ruff = "^0.16.0"
types-pyyaml = "^6.0.12.20260724"
mypy = "^2.3.0"
sphinx-js = "^5.0.3"
myst-parser = "^5.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
files = ["src/graphtransliterator"]
exclude = ["tests/"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort (import sorting)
    "UP", # pyupgrade (upgrades syntax to modern Python 3.10+)
]
ignore = [
    "UP038", # Allow tuple syntax in isinstance checks
]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["graphtransliterator"]

[tool.deptry]
known_first_party = ["graphtransliterator"]
exclude = ["docs", "tests", ".tox"]

[tool.deptry.per_rule_ignores]
DEP003 = ["pytest"]

[tool.setuptools.package-data]
"graph_transliterator" = ["py.typed"]

[tox]
toxworkdir = "{toxinidir}/.tox"
env_list = ["py311", "py312", "py313"]
