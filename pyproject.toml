[project]
name = "graphtransliterator-workspace"
version = "1.3.1"
description = "Monorepo workspace root environment"
requires-python = ">=3.10,<4.0"

[tool.poetry]
package-mode = false  # Crucial: Tells Poetry this directory is an environment orchestrator only

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
# Links your package locally in editable mode
graphtransliterator = { path = "./packages/graphtransliterator-py", develop = true }

[tool.poetry.group.dev.dependencies]
bash_kernel = "^0.9.1"
coverage = "^7.3.2"
flake8 = "^6.1.0"
jupyter-sphinx = "^0.4.0"
pytest = "^7.4.2"
sphinx-issues = "^3.0.1"
tox = "^4.11.3"
deptry = "^0.12.0"
pre-commit = "^3.5.0"
sphinx-rtd-theme = "^1.3.0"
pytest-cov = "^4.1.0"
ruff = "^0.15.21"
mypy = "^2.3.0"
types-pyyaml = "^6.0.12.20260518"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
# Updated path to match the new nested directory structure
files = ["packages/graphtransliterator-py/src/graphtransliterator"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "packages/graphtransliterator-py/src"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["packages/graphtransliterator-py/src/graphtransliterator"]
