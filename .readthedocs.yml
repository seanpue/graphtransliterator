# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Build documentation in the docs/ directory with Sphinx
sphinx:
    configuration: docs/conf.py

# Optionally build your docs in additional formats such as PDF and ePub
formats: all

build:
    os: ubuntu-22.04
    tools:
        python: "3.11"
    jobs:
        post_create_environment:
            # Install a specific, stable version of poetry into the RTD virtual environment
            - $READTHEDOCS_VIRTUALENV_PATH/bin/pip install "poetry>=2.0.0,<3.0.0"
            # Explicitly tell poetry to point to the Read the Docs virtual environment
            - $READTHEDOCS_VIRTUALENV_PATH/bin/poetry env use $READTHEDOCS_VIRTUALENV_PATH/bin/python
        post_install:
            # Install dependencies cleanly into that exact environment
            - $READTHEDOCS_VIRTUALENV_PATH/bin/poetry install
