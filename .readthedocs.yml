# .readthedocs.yml
version: 2

formats: all

build:
    os: ubuntu-22.04
    tools:
        python: "3.11"
    commands:
        # 1. Manually create the virtual environment
        - python -m virtualenv $READTHEDOCS_VIRTUALENV_PATH

        # 2. Upgrade pip and install poetry + sphinx into the environment core
        - $READTHEDOCS_VIRTUALENV_PATH/bin/pip install --upgrade pip setuptools
        - $READTHEDOCS_VIRTUALENV_PATH/bin/pip install "poetry>=2.0.0,<3.0.0" sphinx

        # 3. Tell poetry NOT to create its own virtualenv
        - $READTHEDOCS_VIRTUALENV_PATH/bin/poetry config virtualenvs.create false

        # 4. Explicitly pass the active environment path so poetry drops packages in the right sandbox
        - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH $READTHEDOCS_VIRTUALENV_PATH/bin/poetry install --with dev

        # 5. Manually trigger the Sphinx build
        - $READTHEDOCS_VIRTUALENV_PATH/bin/python -m sphinx -T -b html -d _build/doctrees -D language=en docs $READTHEDOCS_OUTPUT/html
