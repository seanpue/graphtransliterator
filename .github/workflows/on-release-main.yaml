name: release-main

on:
    release:
        types: [published]
        branches: [main]

jobs:
    publish:
        runs-on: ubuntu-latest
        # 👇 This ensures the job ONLY executes if your release tag starts with 'py-'
        if: startsWith(github.ref_name, 'py-')
        defaults:
            run:
                working-directory: packages/graphtransliterator-py
        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Set up the environment
              uses: ./.github/actions/setup-poetry-env

            - name: Export tag
              id: vars
              run: |
                  # github.ref_name is just the tag name (e.g., py-v1.3.2)
                  RAW_TAG="${{ github.ref_name }}"
                  # Strip 'py-v' prefix to isolate the raw semver (e.g., 1.3.2)
                  CLEAN_VERSION="${RAW_TAG#py-v}"
                  echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

            - name: Build and publish
              run: |
                  # Automatically synchronize pyproject.toml version with your git tag
                  poetry version ${{ steps.vars.outputs.version }}
                  poetry build
                  poetry publish --username __token__ --password ${{ secrets.PYPI_TOKEN }}
              env:
                  PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
                  RELEASE_VERSION: ${{ steps.vars.outputs.version }}
