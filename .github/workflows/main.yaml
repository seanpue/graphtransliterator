name: Main

on:
    push:
        branches:
            - main
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              uses: actions/checkout@v4

            - uses: actions/cache@v4
              with:
                  path: ~/.cache/pre-commit
                  key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

            - name: Set up the environment
              uses: ./.github/actions/setup-poetry-env

            - name: Run Python checks
              run: make check-py

    tox:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13"]
            fail-fast: false
        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Set up python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install Poetry
              run: pipx install poetry

            - name: Load cached venv
              uses: actions/cache@v4
              with:
                  path: .tox
                  key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('packages/graphtransliterator-py/poetry.lock') }}

            - name: Install tox
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install tox tox-gh-actions

            - name: Test with tox
              run: tox -c packages/graphtransliterator-py/tox.ini

            - name: Upload coverage reports to Codecov with GitHub Action on Python 3.10
              uses: codecov/codecov-action@v4
              if: ${{ matrix.python-version == '3.10' }}

    typescript-tests:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: packages/graphtransliterator-ts
        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
                  cache: true
                  cache-dependency-path: packages/graphtransliterator-ts/pnpm-lock.yaml

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint and Format Check
              run: pnpm run lint

            - name: Build TypeScript
              run: pnpm run build

            - name: Run Tests
              run: pnpm run test