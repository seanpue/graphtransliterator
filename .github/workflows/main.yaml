typescript-tests:
    runs-on: ubuntu-latest
    defaults:
        run:
            working-directory: packages/graphtransliterator-ts
    steps:
        - name: Check out
          uses: actions/checkout@v4

        - name: Install pnpm
          uses: pnpm/action-setup@v4
          with:
              version: 9

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
              node-version: 22
              cache: "pnpm"
              cache-dependency-path: pnpm-lock.yaml # 👈 Fixed to point to root lockfile!

        - name: Install dependencies
          run: pnpm install --frozen-lockfile

        - name: Lint and Format Check
          run: pnpm run lint

        - name: Build TypeScript
          run: pnpm run build

        - name: Run Tests
          run: pnpm run test
