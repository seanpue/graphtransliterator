repos:
    # --- GLOBAL / GENERIC HOOKS ---
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.6.0
      hooks:
          - id: check-case-conflict
          - id: check-merge-conflict
          - id: end-of-file-fixer
          - id: trailing-whitespace

    # --- PYTHON SUITE (Isolated to the Python subpackage) ---
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.4.4
      hooks:
          - id: ruff
            files: ^packages/graphtransliterator-py/
            args: [--fix]
          - id: ruff-format
            files: ^packages/graphtransliterator-py/

    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v1.10.0
      hooks:
          - id: mypy
            files: ^packages/graphtransliterator-py/src/
            additional_dependencies: [types-PyYAML, marshmallow]

    # --- TYPESCRIPT / JS SUITE (Biome via root pnpm) ---
    - repo: local
      hooks:
          - id: biome-check
            name: run biome check (ts)
            entry: pnpm --filter graphtransliterator lint:fix
            language: system
            files: ^packages/graphtransliterator-ts/
            pass_filenames: false

    # --- DOCUMENTATION SUITE ---
    - repo: local
      hooks:
          - id: sphinx-build
            name: build sphinx documentation
            entry: >-
              bash -c "
              npx --package=typescript@5.7.3 --package=typedoc --package=typedoc-plugin-markdown typedoc
              --plugin typedoc-plugin-markdown
              --entryPoints packages/graphtransliterator-ts/src/index.ts
              --out packages/graphtransliterator-py/docs/typescript_api
              --readme none
              --skipErrorChecking true &&
              poetry run --directory packages/graphtransliterator-py sphinx-build -b html -W --keep-going docs docs/_build/html
              "
            language: system
            files: ^packages/(graphtransliterator-py/(docs|src)|graphtransliterator-ts/src)/
            pass_filenames: false
